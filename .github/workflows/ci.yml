name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            configure: ninja-debug
            build: ninja-debug
            test: ninja-debug
            cxx: g++
          - name: Linux GCC Release
            os: ubuntu-latest
            configure: ninja-release
            build: ninja-release
            test: ninja-release
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            configure: ninja-debug
            build: ninja-debug
            test: ninja-debug
            cxx: clang++
          - name: macOS AppleClang
            os: macos-latest
            configure: ninja-debug
            build: ninja-debug
            test: ninja-debug
            cxx: clang++
          - name: Windows MSVC
            # windows-latest 自 2026-06 起是 Visual Studio 2026，没有 VS 2022 实例。
            # 预设 windows-vs 固定生成器 Visual Studio 17 2022，因此钉在 windows-2022。
            os: windows-2022
            configure: windows-vs
            build: windows-vs-debug
            test: windows-vs-debug
            cxx: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.configure }}
        env:
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build }}

      - name: Test
        run: ctest --preset ${{ matrix.test }}

  # 安装包消费方冒烟。上面的矩阵全部在仓库自己的 CMake 树里构建，使用的
  # 编码选项来自顶层 add_compile_options —— 正因为如此，导出目标漏掉
  # INTERFACE_COMPILE_OPTIONS 这件事在那些腿上永远看不见。这里刻意绕开
  # in-tree 构建：install 到临时前缀，再用 find_package 构建 ci/consumer，
  # 最后跑起来。
  #
  # 这条防线的强度来自 ci/consumer 里的 /WX。实测（cp936 主机）：缺 /utf-8
  # 时只会产生 C4819 警告、0 个 error —— **补 /WX 之前**的 MSBuild 命令行
  # （摘要）为 `/W1 /WX- /external:W0 /external:I "<prefix>/include"`：安装
  # 前缀被当作外部头、其警告被压到 0 级，警告本身又永不致失败，而作业只看
  # 退出码，于是整条流程照样全绿。/WX 把 C4819 变成硬失败，这才守住了回归。
  consumer-smoke:
    name: Windows MSVC (installed package consumer)
    # 与 Windows MSVC 相同：预设要求 Visual Studio 17 2022，不能用 windows-latest。
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-vs

      - name: Build
        run: cmake --build --preset windows-vs-release

      - name: Install into a prefix
        run: cmake --install build/windows-vs --config Release --prefix "${{ github.workspace }}/build/_install"

      - name: Configure the consumer
        run: cmake -S ci/consumer -B build/consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/_install"

      - name: Build the consumer
        run: cmake --build build/consumer --config Release

      - name: Run the consumer
        run: ./build/consumer/Release/consumer.exe
